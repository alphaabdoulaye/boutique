<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORO PRESTIGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .product-card { transition: transform 0.2s ease; cursor: pointer; }
        .product-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-[#fdf6f9] text-gray-900 font-sans pb-44">

    <nav class="bg-purple-900 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-black uppercase text-[#a3e635]">GORO PRESTIGE</h1>
        <button onclick="toggleAdmin()" id="admin-btn" class="bg-[#a3e635] text-purple-950 px-3 py-2 rounded-full text-xs font-black uppercase">⚙️ Admin</button>
    </nav>

    <div id="admin-panel" class="hidden max-w-md mx-auto m-4 p-6 bg-white rounded-3xl border-2 border-pink-400 shadow-xl">
        <h2 class="text-lg font-bold mb-4">📦 Ajouter un produit</h2>
        <input type="hidden" id="p-edit-id">
        <input type="text" id="p-name" placeholder="Nom" class="w-full p-3 border rounded-xl mb-3">
        <input type="number" id="p-price" placeholder="Prix (FCFA)" class="w-full p-3 border rounded-xl mb-3">
        <select id="p-category" class="w-full p-3 border rounded-xl mb-3">
            <option value="Chaussures">Chaussures</option>
            <option value="Habits">Habits</option>
            <option value="Sacs">Sacs</option>
            <option value="Accessoires">Accessoires</option>
        </select>
        <input type="file" id="p-file-main" accept="image/*" class="w-full mb-4">
        <button onclick="saveProduct()" class="w-full bg-pink-500 text-white font-bold py-3.5 rounded-xl">🚀 Mettre en ligne</button>
    </div>

    <main class="max-w-xl mx-auto px-4 mt-6">
        <div id="products-container" class="grid grid-cols-2 gap-4"></div>
    </main>

    <script>
        const SUPABASE_URL = "https://rxpirlmzeksiqkppllro.supabase.co";
        const SUPABASE_KEY = "sb_publishable_xySjlB_pVZ0uSPIQoojlrw_Su6avPpd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Upload vers le bucket "product-images" (en minuscules)
        async function uploadToStorage(file) {
            if (!file) return null;
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await _supabase.storage
                .from('product-images')
                .upload(fileName, file);

            if (error) throw error;
            
            const { data: { publicUrl } } = _supabase.storage
                .from('product-images')
                .getPublicUrl(fileName);
            return publicUrl;
        }

        async function saveProduct() {
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const category = document.getElementById('p-category').value;
            const fMain = document.getElementById('p-file-main').files[0];
            
            if (!name || !price || !fMain) { alert("Remplissez tout et choisissez une image !"); return; }

            alert("Upload en cours, patientez...");

            try {
                const imageUrl = await uploadToStorage(fMain);
                const { error } = await _supabase.from('products').insert([
                    { name, price, category, img_main: imageUrl }
                ]);

                if (error) throw error;
                alert("✅ Succès !");
                location.reload();
            } catch (e) {
                alert("Erreur : " + e.message);
            }
        }

        function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('hidden'); }

        async function loadProducts() {
            const { data } = await _supabase.from('products').select('*').order('id', { ascending: false });
            if (data) {
                document.getElementById('products-container').innerHTML = data.map(p => `
                    <div class="bg-white p-3 rounded-3xl shadow-sm border border-pink-100">
                        <img src="${p.img_main}" class="w-full h-32 object-cover rounded-2xl">
                        <h3 class="font-bold text-xs mt-2">${p.name}</h3>
                        <p class="text-pink-600 font-black">${p.price.toLocaleString()} F</p>
                    </div>
                `).join('');
            }
        }

        loadProducts();
    </script>
</body>
</html>
